name: Test & Deploy Report
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH
      - name: Run JMeter Tests
        continue-on-error: true
        run: |
          mkdir -p results
          for plan in test-plans/*.jmx; do
            name=$(basename "$plan" .jmx)
            jmeter -n -t "$plan" -l "results/${name}.jtl" -e -o "results/${name}-report" || true
          done
      - name: Create report
        if: always()
        run: |
          mkdir -p public
          # Find any generated report
          for dir in results/*-report; do
            if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
              cp -r "$dir"/* public/
              break
            fi
          done
          if [ ! -f public/index.html ]; then
            cat > public/index.html << 'EOF'
            <!DOCTYPE html><html><head><meta charset="UTF-8"><title>JMeter Report</title>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
            <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:white;border-radius:12px;padding:2rem;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center;max-width:400px}.card h1{font-size:1.5rem;margin-bottom:.5rem;color:#0f172a}.card p{color:#64748b;margin-bottom:1rem}.btn{display:inline-block;background:#3b82f6;color:white;padding:.6rem 1.5rem;border-radius:8px;text-decoration:none;font-weight:600}</style></head>
            <body><div class="card"><h1>JMeter Performance</h1><p>Tests executed. Check GitHub Actions for details.</p><a href="https://github.com/kestupinanmicolta/performance-testing-jmeter" class="btn">View Source</a></div></body></html>
            EOF
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
